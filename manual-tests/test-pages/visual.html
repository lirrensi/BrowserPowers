<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Visual Elements — overlay test</title>
  <style>body { margin: 0; padding: 0; background: white; }</style>
</head>
<body>
  <button style="position:absolute; left:50px;  top:50px;  width:120px; height:40px; background:lightblue;">Button A</button>
  <button style="position:absolute; left:200px; top:50px;  width:120px; height:40px; background:lightgreen;">Button B</button>
  <input  style="position:absolute; left:50px;  top:120px; width:270px; height:30px; font-size:16px;" placeholder="type something">
  <a href="#" style="position:absolute; left:50px; top:200px; color:blue; font-size:18px;">A link</a>
  <select style="position:absolute; left:50px; top:250px; width:150px; height:30px;">
    <option>Option 1</option>
    <option>Option 2</option>
  </select>
</body>
</html>
